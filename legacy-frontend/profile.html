<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Set Up Profile - CBDventures</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* Page-specific styles for the profile screen */
    .profile-header { margin-top: clamp(16px, 4vh, 32px); }
    .profile-header h1 { font-size: var(--title-size); font-weight: 800; line-height: 1.1; }

    /* Avatar */
    .avatar-wrap { display: flex; justify-content: center; margin: clamp(16px, 3vh, 28px) 0 4px; }
    .avatar {
      position: relative;
      width: clamp(96px, 28vw, 128px);
      height: clamp(96px, 28vw, 128px);
      border-radius: 50%;
      background: var(--white);
      border: 2px solid var(--blue-btn);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--blue-btn);
      cursor: pointer;
    }
    .avatar > svg { width: 30%; height: 30%; }
    .avatar input { display: none; }
    .avatar .plus {
      position: absolute;
      right: 2px;
      bottom: 2px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--blue-btn);
      border: 2px solid var(--page-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
    }
    .avatar .plus svg { width: 14px; height: 14px; }

    /* Phone field */
    .prefix { color: var(--muted); font-size: var(--text-size); flex-shrink: 0; }

    /* Select */
    .select-field { position: relative; }
    .select-field select {
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: clamp(14px, 3.6vw, 18px) 44px clamp(14px, 3.6vw, 18px) 16px;
      font-family: inherit;
      font-size: var(--text-size);
      color: var(--ink);
      outline: none;
      cursor: pointer;
    }
    .select-field select:focus { border-color: var(--blue-light); box-shadow: 0 0 0 3px rgba(59,130,246,.18); }
    .select-field svg {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: #475569;
      pointer-events: none;
    }

    /* Travel preference chips */
    .chips {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    /* Cancels the margin and font rules the form gives to every label */
    .login-form .chips .chip {
      position: relative;
      display: inline-flex;
      margin: 0;
      font-size: inherit;
      font-weight: inherit;
      line-height: 1;
    }

    .chip input { position: absolute; opacity: 0; pointer-events: none; }

    .chip span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: var(--white);
      color: #334155;
      font-size: var(--small-size);
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      transition: background .15s, border-color .15s, color .15s;
    }

    .chip svg { width: 16px; height: 16px; flex-shrink: 0; }
    .chip .on { display: none; }
    .chip .off { color: #94a3b8; }

    .chip input:checked + span {
      background: #eff4ff;
      border-color: var(--blue-btn);
      color: var(--blue-btn);
    }
    .chip input:checked + span .on { display: block; }
    .chip input:checked + span .off { display: none; }
    .chip input:focus-visible + span { box-shadow: 0 0 0 3px rgba(59,130,246,.3); }

    /* Red asterisk for required labels */
    .required::after {
      content: " *";
      color: #dc2626;
      font-weight: 700;
    }
  </style>
</head>
<body class="login">
  <main class="login-screen">
    <div class="login-inner">

      <header class="profile-header" style="text-align:center;">
        <h1>Set Up Profile</h1>
        <p class="subtitle">Help us tailor your Pretoria adventure</p>
      </header>

      <form class="login-form" id="profileForm" action="#" method="post">

        <!-- Profile photo -->
        <div class="avatar-wrap">
          <label class="avatar" aria-label="Add profile photo">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
            <span class="plus" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
            </span>
            <input type="file" accept="image/*">
          </label>
        </div>

        <!-- Full name -->
        <label for="fullname" class="required">Full Name</label>
        <div class="field">
          <input type="text" id="fullname" name="fullname" autocomplete="name" required>
        </div>

        <!-- Preferred profile name -->
        <label for="preferredname" class="required">Preferred Profile Name</label>
        <div class="field">
          <input type="text" id="preferredname" name="preferredname" placeholder="What should we call you?" maxlength="30" autocomplete="nickname" required>
        </div>

        <!-- Phone number -->
        <label for="phone" class="required">Phone Number</label>
        <div class="field">
          <span class="prefix">+27</span>
          <input type="tel" id="phone" name="phone" autocomplete="tel-national" required>
        </div>

        <!-- Nationality -->
        <label for="nationality" class="required">Nationality</label>
        <div class="select-field">
          <select id="nationality" name="nationality" required>
            <option value="" selected disabled>Select your nationality</option>
            <option>South Africa</option>
            <option>United Kingdom</option>
            <option>United States</option>
            <option>Zimbabwe</option>
            <option>Mozambique</option>
            <option>Nigeria</option>
            <option>Kenya</option>
            <option>Germany</option>
            <option>France</option>
            <option>India</option>
            <option>Other</option>
          </select>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>

        <!-- Travel preferences -->
        <label class="required">Travel Preferences</label>
        <div class="chips">

          <label class="chip">
            <input type="checkbox" name="prefs" value="attractions">
            <span>
              <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
              <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.55"/><polyline points="8 11.5 11 14.5 21 4.5"/></svg>
              Attractions
            </span>
          </label>

          <label class="chip">
            <input type="checkbox" name="prefs" value="restaurants">
            <span>
              <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
              <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.55"/><polyline points="8 11.5 11 14.5 21 4.5"/></svg>
              Restaurants
            </span>
          </label>

          <label class="chip">
            <input type="checkbox" name="prefs" value="hotels">
            <span>
              <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
              <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.55"/><polyline points="8 11.5 11 14.5 21 4.5"/></svg>
              Hotels
            </span>
          </label>

          <label class="chip">
            <input type="checkbox" name="prefs" value="nightlife">
            <span>
              <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
              <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.55"/><polyline points="8 11.5 11 14.5 21 4.5"/></svg>
              Nightlife
            </span>
          </label>

          <label class="chip">
            <input type="checkbox" name="prefs" value="culture">
            <span>
              <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
              <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.55"/><polyline points="8 11.5 11 14.5 21 4.5"/></svg>
              Culture
            </span>
          </label>

        </div>

        <div class="spacer"></div>

        <button type="submit" class="btn btn-blue" style="margin-top:1.5rem;">Save Profile</button>
      </form>

    </div>
  </main>

  <script>
    // Require at least one travel preference
    var chips = document.querySelectorAll('.chips input[type="checkbox"]');

    function checkChips() {
      var anyChecked = Array.prototype.some.call(chips, function (c) { return c.checked; });
      chips[0].setCustomValidity(anyChecked ? '' : 'Please select at least one travel preference.');
    }

    chips.forEach(function (c) { c.addEventListener('change', checkChips); });
    checkChips();
  </script>
  <script src="app.js"></script>
</body>
</html>
