<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign Up - CBDventures</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login">
  <main class="login-screen">
    <div class="login-inner">

      <header class="login-header" style="text-align:center;">
        <h1>Create Account</h1>
        <p class="subtitle">Join CBDventures and start exploring Pretoria</p>
      </header>

      <form class="login-form" id="signupForm" action="#" method="post">

        <label for="name">Full Name</label>
        <div class="field">
          <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" id="name" name="name" placeholder="John Doe" autocomplete="name" required>
        </div>

        <label for="email">Email Address</label>
        <div class="field">
          <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <polyline points="3 7 12 13 21 7"/>
          </svg>
          <input type="email" id="email" name="email" placeholder="john.doe@example.com" autocomplete="email" required>
        </div>

        <label for="password">Password</label>
        <div class="field">
          <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="5" y="11" width="14" height="10" rx="2"/>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
          </svg>
          <input type="password" id="password" name="password" placeholder="At least 8 characters" minlength="8" autocomplete="new-password" required>
          <button type="button" class="toggle" data-target="password" aria-label="Show or hide password">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>

        <label for="confirm">Confirm Password</label>
        <div class="field">
          <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="5" y="11" width="14" height="10" rx="2"/>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
          </svg>
          <input type="password" id="confirm" name="confirm" placeholder="Re-enter your password" autocomplete="new-password" required>
          <button type="button" class="toggle" data-target="confirm" aria-label="Show or hide password">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>

        <div class="spacer"></div>

        <button type="submit" class="btn btn-blue">Create Account</button>
      </form>

      <p class="signup">Already have an account? <a href="page2.html">Sign in</a></p>

      <div class="divider"><span>OR SIGN UP WITH</span></div>

      <div class="social">
        <a class="btn btn-outline" href="#">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/>
            <line x1="21.17" y1="8" x2="12" y2="8"/>
            <line x1="3.95" y1="6.06" x2="8.54" y2="14"/>
            <line x1="10.88" y1="21.94" x2="15.46" y2="14"/>
          </svg>
          Google
        </a>
        <a class="btn btn-outline" href="#">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 7c-2-2-6-1-6 3 0 4 3 9 6 9s6-5 6-9c0-4-4-5-6-3z"/>
            <path d="M12 7c0-2 1-4 3-5"/>
          </svg>
          Apple
        </a>
      </div>

      <a class="guest" href="page5.html">Continue as Guest</a>
    </div>
  </main>

  <script>
    // Show / hide password buttons
    document.querySelectorAll('.toggle').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var input = document.getElementById(btn.dataset.target);
        input.type = input.type === 'password' ? 'text' : 'password';
      });
    });

    // Passwords must match: the browser shows a built-in message if they don't
    var pw = document.getElementById('password');
    var confirmPw = document.getElementById('confirm');

    function checkMatch() {
      confirmPw.setCustomValidity(
        confirmPw.value && confirmPw.value !== pw.value ? 'Passwords do not match.' : ''
      );
    }
    pw.addEventListener('input', checkMatch);
    confirmPw.addEventListener('input', checkMatch);
  </script>
  <script src="app.js"></script>
</body>
</html>
