<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign In - CBDventures</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login">
  <main class="login-screen">
    <div class="login-inner">

      <header class="login-header" style="text-align:center;">
        <h1>Welcome Explorer</h1>
        <p class="subtitle">Sign in to start discovering Pretoria's wonders</p>
      </header>

      <form class="login-form" id="loginForm" action="#" method="post">
        <label for="email">Email Address</label>
        <div class="field">
          <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <polyline points="3 7 12 13 21 7"/>
          </svg>
          <input type="email" id="email" name="email" placeholder="john.doe@example.com" autocomplete="email" required>
        </div>

        <label for="password">Password</label>
        <div class="field">
          <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="5" y="11" width="14" height="10" rx="2"/>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
          </svg>
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="toggle" id="togglePassword" aria-label="Show or hide password">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>

        <a class="forgot" href="#">Forgot Password?</a>

        <div class="spacer"></div>

        <button type="submit" class="btn btn-blue">Sign In</button>
      </form>

      <p class="signup">New here? <a href="signup.html">Sign up</a></p>

      <div class="divider"><span>OR CONTINUE WITH</span></div>

      <div class="social">
        <a class="btn btn-outline" href="#">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/>
            <line x1="21.17" y1="8" x2="12" y2="8"/>
            <line x1="3.95" y1="6.06" x2="8.54" y2="14"/>
            <line x1="10.88" y1="21.94" x2="15.46" y2="14"/>
          </svg>
          Google
        </a>
        <a class="btn btn-outline" href="#">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 7c-2-2-6-1-6 3 0 4 3 9 6 9s6-5 6-9c0-4-4-5-6-3z"/>
            <path d="M12 7c0-2 1-4 3-5"/>
          </svg>
          Apple
        </a>
      </div>

      <a class="guest" href="page5.html">Continue as Guest</a>
    </div>
  </main>

  <script>
    var pw = document.getElementById('password');
    document.getElementById('togglePassword').addEventListener('click', function () {
      pw.type = pw.type === 'password' ? 'text' : 'password';
    });
  </script>
  <script src="app.js"></script>
</body>
</html>
