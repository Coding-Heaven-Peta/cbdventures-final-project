<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Home - CBDventures</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body { background: var(--page-bg); }

    .home {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: max(var(--pad), env(safe-area-inset-top)) var(--pad) 110px;
    }

    /* Top bar */
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .greeting { color: var(--muted); font-size: var(--small-size); }
    .username { font-size: clamp(1.4rem, 6vw, 1.9rem); font-weight: 800; line-height: 1.15; }
    .avatar-sm {
      width: clamp(48px, 13vw, 60px);
      height: clamp(48px, 13vw, 60px);
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      background: linear-gradient(135deg, #93c5fd, #3b82f6);
      border: 2px solid var(--white);
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    .avatar-sm img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* Search */
    .search {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: clamp(14px, 3vh, 22px);
      padding: 0 16px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .search:focus-within { border-color: var(--blue-light); box-shadow: 0 0 0 3px rgba(59,130,246,.18); }
    .search svg { width: 20px; height: 20px; color: #94a3b8; flex-shrink: 0; }
    .search input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      font-family: inherit;
      font-size: var(--text-size);
      padding: clamp(13px, 3.4vw, 16px) 0;
      color: var(--ink);
    }
    .search input::placeholder { color: #64748b; }

    /* Category pills */
    .cats {
      display: flex;
      gap: 10px;
      margin: 16px calc(var(--pad) * -1) 0;
      padding: 2px var(--pad);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .cats::-webkit-scrollbar { display: none; }
    .cat {
      flex-shrink: 0;
      padding: 9px 22px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--white);
      color: #334155;
      font-family: inherit;
      font-size: var(--small-size);
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }
    .cat.active { background: var(--blue-btn); border-color: var(--blue-btn); color: var(--white); }

    /* Section headings */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: clamp(20px, 4vh, 30px) 0 14px;
    }
    .section-head h2 { font-size: clamp(1.1rem, 4.6vw, 1.35rem); font-weight: 800; }
    .see-all { color: var(--blue-link); font-weight: 700; font-size: var(--small-size); }

    /* Featured carousel */
    .featured {
      display: flex;
      gap: 14px;
      margin: 0 calc(var(--pad) * -1);
      padding: 0 var(--pad) 4px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .featured::-webkit-scrollbar { display: none; }

    .feat-card {
      position: relative;
      flex: 0 0 auto;
      width: clamp(260px, 78vw, 360px);
      height: clamp(170px, 48vw, 240px);
      border-radius: 20px;
      overflow: hidden;
      scroll-snap-align: start;
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      color: var(--white);
    }
    .feat-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .feat-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0) 55%);
    }
    .badge {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 1;
      padding: 5px 12px;
      border-radius: 8px;
      background: rgba(255,255,255,.28);
      backdrop-filter: blur(4px);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .04em;
    }
    .feat-title {
      position: absolute;
      left: 16px;
      bottom: 14px;
      z-index: 1;
      font-size: clamp(1.15rem, 5vw, 1.5rem);
      font-weight: 800;
    }

    /* Popular nearby list */
    .nearby { display: flex; flex-direction: column; gap: 14px; }
    .place {
      display: flex;
      gap: 14px;
      padding: 12px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 2px 8px rgba(15,23,42,.04);
    }
    .thumb {
      position: relative;
      width: clamp(72px, 22vw, 96px);
      height: clamp(72px, 22vw, 96px);
      border-radius: 12px;
      overflow: hidden;
      flex-shrink: 0;
      background: linear-gradient(135deg, #cbd5e1, #94a3b8);
    }
    .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

    .place-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
    .meta { font-size: .72rem; color: var(--muted); font-weight: 600; }
    .meta .tag { color: var(--blue-link); font-weight: 800; letter-spacing: .02em; text-transform: uppercase; }
    .place-name { font-size: var(--text-size); font-weight: 800; }
    .rating { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: var(--small-size); }
    .rating svg { width: 16px; height: 16px; color: #f97316; }
    .price { align-self: flex-end; font-weight: 800; font-size: var(--text-size); color: #1e293b; }

    /* Bottom navigation */
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      background: var(--white);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .bottom-nav ul {
      list-style: none;
      display: flex;
      justify-content: space-around;
      max-width: 760px;
      margin: 0 auto;
      padding: 10px 8px 12px;
    }
    .bottom-nav a {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 56px;
      color: #94a3b8;
      font-size: .72rem;
      font-weight: 700;
    }
    .bottom-nav svg { width: 24px; height: 24px; }
    .bottom-nav a.active { color: var(--blue-btn); }
    .bottom-nav a:hover { color: var(--blue-link); }
  </style>
</head>
<body>
  <main class="home">

    <!-- Top bar -->
    <header class="topbar">
      <div>
        <p class="greeting">G'day, Explorer!</p>
        <h1 class="username">Sarah Jenkins</h1>
        <a href="#" id="logout" class="see-all" style="display:inline-block;margin-top:6px;">Log out</a>
      </div>
      <a class="avatar-sm" href="page4.html" aria-label="Your profile">
        <img src="images/avatar.jpg" alt="" onerror="this.style.display='none'">
      </a>
    </header>

    <!-- Search -->
    <label class="search">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/>
      </svg>
      <input type="search" placeholder="Search landmarks, food, stays...">
    </label>

    <!-- Categories -->
    <nav class="cats" aria-label="Categories">
      <button class="cat active" type="button">All</button>
      <button class="cat" type="button">Attractions</button>
      <button class="cat" type="button">Restaurants</button>
      <button class="cat" type="button">Hotels</button>
      <button class="cat" type="button">Nightlife</button>
      <button class="cat" type="button">Culture</button>
    </nav>

    <!-- Featured -->
    <div class="section-head">
      <h2>Featured Attractions</h2>
      <a class="see-all" href="#">See All</a>
    </div>

    <div class="featured">
      <a class="feat-card" href="#">
        <img src="images/union-buildings.jpg" alt="Union Buildings" onerror="this.style.display='none'">
        <span class="badge">POPULAR</span>
        <span class="feat-title">Union Buildings</span>
      </a>
      <a class="feat-card" href="#">
        <img src="images/church-square.jpg" alt="Church Square" onerror="this.style.display='none'">
        <span class="badge">POPULAR</span>
        <span class="feat-title">Church Square</span>
      </a>
    </div>

    <!-- Popular nearby -->
    <div class="section-head">
      <h2>Popular Nearby</h2>
      <a class="see-all" href="#">See All</a>
    </div>

    <div class="nearby">
      <a class="place" href="#">
        <div class="thumb">
          <img src="images/national-zoo.jpg" alt="National Zoo" onerror="this.style.display='none'">
        </div>
        <div class="place-info">
          <p class="meta"><span class="tag">Attraction</span> &nbsp;•&nbsp; 1.2 km away</p>
          <h3 class="place-name">National Zoo</h3>
          <p class="rating">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9"/></svg>
            4.7
          </p>
        </div>
        <span class="price">R90</span>
      </a>

      <a class="place" href="#">
        <div class="thumb">
          <img src="images/blue-room-jazz.jpg" alt="The Blue Room Jazz" onerror="this.style.display='none'">
        </div>
        <div class="place-info">
          <p class="meta"><span class="tag">Restaurants</span> &nbsp;•&nbsp; 0.8 km away</p>
          <h3 class="place-name">The Blue Room Jazz</h3>
          <p class="rating">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9"/></svg>
            4.9
          </p>
        </div>
        <span class="price">R270</span>
      </a>
    </div>
  </main>

  <!-- Bottom navigation -->
  <nav class="bottom-nav" aria-label="Main">
    <ul>
      <li>
        <a class="active" href="page5.html">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-7H9v7H5a2 2 0 0 1-2-2z"/></svg>
          Home
        </a>
      </li>
      <li>
        <a href="page6.html">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="1 6 8 3 16 6 23 3 23 18 16 21 8 18 1 21"/><line x1="8" y1="3" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="21"/></svg>
          Map
        </a>
      </li>
      <li>
        <a href="page7.html">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.2A8.4 8.4 0 1 1 21 11.5z"/></svg>
          Chat
        </a>
      </li>
      <li>
        <a href="page4.html">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Profile
        </a>
      </li>
    </ul>
  </nav>

  <script src="app.js"></script>
</body>
</html>
